<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hope & Healing Foundation | مؤسسة الأمل والشفاء</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

<div class="overlay"></div>

<header class="hero">

    <div class="container">

        <img src="logo.png" class="logo">

        <h1>Hope & Healing Foundation</h1>

        <h2>مؤسسة الأمل والشفاء</h2>

        <p class="hero-text">
            معًا... لإنقاذ حياة
        </p>

    </div>

</header>

<section class="donation">

<div class="container">

<h2 class="section-title">

<i class="fa-solid fa-hand-holding-heart"></i>

اختر مبلغ التبرع

</h2>

<div class="amounts">

<button class="amount-btn">300 جنيه</button>

<button class="amount-btn">500 جنيه</button>

<button class="amount-btn active">1000 جنيه</button>

<button class="amount-btn">2000 جنيه</button>

<button class="amount-btn">3000 جنيه</button>

<button class="amount-btn">5000 جنيه</button>

</div>

<div class="custom-amount">

<input
type="number"
placeholder="أدخل مبلغًا آخر">

</div>

</div>

</section>

<section class="payment">

<div class="container">

<h2 class="section-title">

طرق التبرع

</h2>

<div class="payment-cards">

<div class="card vodafone">

<div class="top">

<img src="assets/vodafone-cash.png">

<h3>

Vodafone Cash

</h3>

</div>

<p class="number">

01040214464

</p>

<button
onclick="copyVodafone()">

<i class="fa-regular fa-copy"></i>

نسخ الرقم

</button>

</div><div class="card instapay">

                    <div class="top">

                        <img src="assets/instapay.png" alt="InstaPay">

                        <h3>InstaPay</h3>

                    </div>

                    <p class="number">

                        awtmx@instapay

                    </p>

                    <button onclick="copyInsta()">

                        <i class="fa-regular fa-copy"></i>

                        نسخ الحساب

                    </button>

                </div>

            </div>

        </div>

    </section>

    <section class="thanks">

        <div class="container">

            <i class="fa-solid fa-heart"></i>

            <h2>شكرًا لدعمكم الكريم ❤️</h2>

            <p>

                كل مساهمة منكم تمنح الأمل وتساعد في إنقاذ حياة محتاجة للعلاج.

            </p>

        </div>

    </section>

    <footer>

        <p>

            © 2026 Hope & Healing Foundation

        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
