<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hope & Healing Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
<div class="overlay"></div>
<div class="content">
<img src="logo.png" class="logo" alt="Logo">
<h1>Hope & Healing Foundation</h1>
<h2>مؤسسة الأمل والشفاء</h2>
<p>معًا... لإنقاذ حياة</p>
<button id="donateBtn">تبرع الآن</button>
</div>
</header>

<div id="modal" class="modal">
<div class="box">
<span id="close">&times;</span>
<h2>اختر قيمة التبرع</h2>
<div class="grid">
<button class="amt">300</button>
<button class="amt">500</button>
<button class="amt">1000</button>
<button class="amt">2000</button>
<button class="amt">3000</button>
<button class="amt">5000</button>
</div>
<input type="number" placeholder="أدخل مبلغًا آخر">

<div class="pay">
<div class="card">
<h3>Vodafone Cash</h3>
<p id="voda">01040214464</p>
<button class="copy" data-copy="01040214464">نسخ الرقم</button>
</div>

<div class="card">
<h3>InstaPay</h3>
<p id="insta">awtmx@instapay</p>
<button class="copy" data-copy="awtmx@instapay">نسخ العنوان</button>
</div>
</div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
